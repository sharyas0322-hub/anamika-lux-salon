name: Build and publish Anamika Lux Android update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || (echo "Missing ANDROID_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD repository secret" && exit 1)
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Read app version and prepare update manifest
        id: app
        run: |
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\\).*/\\1/p' android/app/build.gradle.kts)
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\\)".*/\\1/p' android/app/build.gradle.kts)
          test -n "$VERSION_CODE" && test -n "$VERSION_NAME"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          cat > android/update.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://github.com/sharyas0322-hub/anamika-lux-salon/releases/latest/download/app-release.apk",
            "releaseNotes": "Anamika Lux app improvements and fixes."
          }
          EOF
      - name: Prepare signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/anamika-upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/anamika-upload.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=anamika-upload" >> "$GITHUB_ENV"
      - name: Build signed release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Publish update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app.outputs.version_name }}
          name: Anamika Lux v${{ steps.app.outputs.version_name }}
          target_commitish: main
          make_latest: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/update.json
