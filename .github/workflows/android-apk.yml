name: Build Android APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Permission to Gradlew
      run: chmod +x gradlew
      working-directory: android

    - name: Build APKs
      run: ./gradlew assembleDebug
      working-directory: android

    - name: Upload Customer APK
      uses: actions/upload-artifact@v4
      with:
        name: The-Anamika-Lux-Customer
        path: android/app/build/outputs/apk/**/customer*debug.apk

    - name: Upload Partner APK
      uses: actions/upload-artifact@v4
      with:
        name: Anamika-Lux-Partner
        path: android/app/build/outputs/apk/**/partner*debug.apk
