name: Build Anamika Lux APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app.html'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Copy web app into Android assets
        run: |
          mkdir -p app/src/main/assets
          cp app.html app/src/main/assets/index.html
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: The-Anamika-Lux-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: The Anamika Lux v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
