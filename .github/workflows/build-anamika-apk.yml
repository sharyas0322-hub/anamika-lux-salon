name: Build Anamika Lux Android APK

# Legacy single-APK pipeline is kept for manual rollback only.
# Normal Customer + Partner APK builds run from android-apk.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable APK
        run: gradle -p android-app assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anamika-lux-android-apk
          path: android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: anamika-lux-app-build-${{ github.run_number }}
          name: The Anamika Lux App - Build ${{ github.run_number }}
          body: |
            Installable Android APK for The Anamika Lux.
            This build is signed with a debug certificate for direct testing and sharing.
            A private release signing key is required before Play Store distribution.
          files: android-app/app/build/outputs/apk/release/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
