<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anamika Lux — Client • Staff • Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>body{background:#050507;color:#f5f1e7;font-family:Arial,sans-serif}.gold{color:#e7ce75}.card{background:linear-gradient(145deg,#171720,#09090d);border:1px solid #3d331b;border-radius:20px;box-shadow:0 18px 45px #0008}.btn{background:linear-gradient(135deg,#f3e5ab,#d4af37,#9f7612);color:#090909;font-weight:800}.muted{color:#aaa69a}.input{background:#101017;border:1px solid #3b3525;color:#fff;border-radius:12px;padding:12px;width:100%;outline:none}.input:focus{border-color:#d4af37}.tab.active{background:#d4af37;color:#090909}</style>
</head><body>
<div class="max-w-6xl mx-auto p-4 md:p-8">
<header class="flex items-center justify-between mb-7"><a href="index.html" class="flex items-center gap-3"><img src="the-anamika-lux-logo.png" class="w-12 h-12 rounded-xl"><div><b class="gold tracking-widest">THE ANAMIKA LUX</b><small class="block muted">SALON MANAGEMENT</small></div></a><button id="logout" class="hidden px-4 py-2 border border-yellow-700 rounded-xl gold">Logout</button></header>
<div id="auth" class="max-w-xl mx-auto card p-5 md:p-8">
<h1 class="text-3xl font-bold mb-2">Welcome to Anamika Lux</h1><p class="muted mb-5">Choose your access type.</p>
<div class="grid grid-cols-3 gap-2 mb-5"><button class="tab active rounded-xl py-3" data-role="client">Client</button><button class="tab rounded-xl py-3" data-role="staff">Staff</button><button class="tab rounded-xl py-3" data-role="admin">Admin</button></div>
<div id="loginBox"><div id="clientSignup" class="hidden space-y-3 mb-5"><h2 class="gold text-xl font-bold">Create Client Account</h2><input id="suName" class="input" placeholder="Full name"><input id="suPhone" class="input" inputmode="numeric" placeholder="10-digit mobile number"><input id="suEmail" class="input" type="email" placeholder="Email"><div class="grid grid-cols-2 gap-3"><input id="suAge" class="input" type="number" placeholder="Age"><select id="suGender" class="input"><option value="">Gender</option><option>Male</option><option>Female</option><option>Other</option></select></div><input id="suPass" class="input" type="password" placeholder="Create password"><button id="signup" class="btn w-full py-3 rounded-xl">Create Account</button><p id="switchLogin" class="text-center gold text-sm cursor-pointer">Already have account? Login</p></div>
<div id="loginFields" class="space-y-3"><input id="identifier" class="input" placeholder="Mobile number"><input id="password" class="input" type="password" placeholder="Password"><button id="login" class="btn w-full py-3 rounded-xl">Login</button><button id="forgot" class="w-full py-2 gold text-sm">Forgot password?</button><p id="switchSignup" class="text-center gold text-sm cursor-pointer">New client? Create account</p></div>
<div id="forgotBox" class="hidden space-y-3"><h2 class="gold text-xl font-bold">Verify Account</h2><input id="fpPhone" class="input" placeholder="Mobile number"><input id="fpEmail" class="input" type="email" placeholder="Registered email"><button id="fpVerify" class="btn w-full py-3 rounded-xl">Verify & Send Reset Link</button><p class="text-xs muted">Mobile + email must match your client account.</p></div>
<p id="msg" class="text-sm mt-4"></p></div></div>
<div id="app" class="hidden"><div id="dashboard"></div></div>
</div>
<script>
const DB_URL="https://uwbcgwvrvtvggmaejxfu.supabase.co",DB_KEY="sb_publishable_CqhbUiMSpMpBSl2X_vKdHg_WimgwESl";
const db=window.supabase.createClient(DB_URL,DB_KEY);let role="client",session=null;
const $=id=>document.getElementById(id),msg=t=>{$("msg").textContent=t};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{role=b.dataset.role;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");$("clientSignup").classList.toggle("hidden",role!=="client");$("switchSignup").classList.toggle("hidden",role!=="client");$("forgot").classList.toggle("hidden",role!=="client");$("identifier").placeholder=role==="client"||role==="staff"?"Mobile number":"Admin email";$("clientSignup").classList.add("hidden");$("loginFields").classList.remove("hidden");$("forgotBox").classList.add("hidden");msg("")});
$("switchSignup").onclick=()=>{$("loginFields").classList.add("hidden");$("clientSignup").classList.remove("hidden")};
$("switchLogin").onclick=()=>{$("clientSignup").classList.add("hidden");$("loginFields").classList.remove("hidden")};
$("forgot").onclick=()=>{$("loginFields").classList.add("hidden");$("forgotBox").classList.remove("hidden")};
$("signup").onclick=async()=>{let name=$("suName").value.trim(),phone=$("suPhone").value.replace(/\D/g,""),email=$("suEmail").value.trim().toLowerCase(),age=Number($("suAge").value),gender=$("suGender").value,pass=$("suPass").value;if(!name||phone.length!==10||!email||!age||!gender||pass.length<6)return msg("Please fill all details. Mobile must be exactly 10 digits.");let r=await db.auth.signUp({email,password:pass});if(r.error)return msg(r.error.message);let u=r.data.user;if(u){let p=await db.rpc("create_client_profile",{p_user_id:u.id,p_name:name,p_phone:phone,p_email:email,p_age:age,p_gender:gender});if(p.error)return msg(p.error.message)}msg("Account created. Please login.");$("switchLogin").click()};
$("login").onclick=async()=>{let id=$("identifier").value.trim(),pass=$("password").value;if(!id||!pass)return msg("Mobile/email and password required.");let email=id;if(role!=="admin"){if(/^\d{10}$/.test(id)){let r=await db.rpc("get_login_email_by_phone",{p_phone:id});if(r.error||!r.data)return msg("Account not found.");email=r.data}}let r=await db.auth.signInWithPassword({email,password:pass});if(r.error)return msg(r.error.message);session=r.data.session;let rr=await db.rpc("my_role");let actual=rr.data||"client";if(role!==actual)return msg("This account is not a "+role+" account.");await loadDashboard(actual)};
$("fpVerify").onclick=async()=>{let p=$("fpPhone").value.replace(/\D/g,""),e=$("fpEmail").value.trim().toLowerCase();if(p.length!==10||!e)return msg("Enter registered mobile and email.");let v=await db.rpc("verify_client_identity",{p_phone:p,p_email:e});if(v.error||!v.data)return msg("Mobile + email did not match.");let r=await db.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname+"?reset=1"});msg(r.error?r.error.message:"Verified. Password reset link sent to your email.")};
async function loadDashboard(r){$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");if(r==="client")return clientDash();if(r==="staff")return staffDash();return adminDash()}
$("logout").onclick=async()=>{await db.auth.signOut();location.reload()};
async function clientDash(){let u=session.user;let {data:p}=await db.from("user_profiles").select("*").eq("id",u.id).maybeSingle();let {data:a}=await db.from("salon_appointments").select("*").eq("client_id",u.id).order("appointment_date",{ascending:false}).limit(20);$("dashboard").innerHTML='<div class="grid md:grid-cols-3 gap-4"><div class="card p-5 md:col-span-2"><p class="gold text-sm">CLIENT DASHBOARD</p><h1 class="text-3xl font-bold mt-1">Hello, '+(p?.full_name||"Client")+'</h1><p class="muted mt-2">Book, track and manage your salon appointments.</p><div class="grid grid-cols-2 gap-3 mt-5"><a href="index.html#serviceMenu" class="btn text-center py-3 rounded-xl">Book Service</a><button onclick="location.reload()" class="border border-yellow-800 gold rounded-xl">Refresh</button></div></div><div class="card p-5"><p class="gold">PROFILE</p><p class="mt-3">'+(p?.phone||"")+'</p><p class="muted">'+(p?.email||"")+'</p></div></div><div class="card p-5 mt-5"><h2 class="text-xl font-bold mb-4">My Appointments</h2>'+rows(a||[],"client")+'</div>'}
async function staffDash(){let {data:a}=await db.from("salon_appointments").select("*").order("appointment_date",{ascending:true}).limit(50);$("dashboard").innerHTML='<div class="card p-5"><p class="gold text-sm">STAFF DASHBOARD</p><h1 class="text-3xl font-bold mt-1">Today’s Work</h1><div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-5"><div class="card p-4"><b>'+(a||[]).filter(x=>x.status!=="completed"&&x.status!=="cancelled").length+'</b><small class="block muted">Active</small></div><div class="card p-4"><b>'+(a||[]).filter(x=>x.status==="completed").length+'</b><small class="block muted">Completed</small></div></div></div><div class="card p-5 mt-5"><h2 class="text-xl font-bold mb-4">Appointments</h2>'+rows(a||[],"staff")+'</div>'}
async function adminDash(){let [{data:a},{data:s},{data:c}]=await Promise.all([db.from("salon_appointments").select("*").order("created_at",{ascending:false}).limit(100),db.from("salon_staff").select("*").order("created_at",{ascending:false}),db.from("user_profiles").select("*").eq("role","client")]);$("dashboard").innerHTML='<div class="grid md:grid-cols-3 gap-4"><div class="card p-5"><p class="gold">CLIENTS</p><b class="text-3xl">'+(c?.length||0)+'</b></div><div class="card p-5"><p class="gold">STAFF</p><b class="text-3xl">'+(s?.length||0)+'</b></div><div class="card p-5"><p class="gold">BOOKINGS</p><b class="text-3xl">'+(a?.length||0)+'</b></div></div><div class="card p-5 mt-5"><h2 class="text-xl font-bold mb-4">All Appointments</h2>'+rows(a||[],"admin")+'</div><div class="card p-5 mt-5"><h2 class="text-xl font-bold mb-4">Staff</h2>'+((s||[]).map(x=>'<div class="flex justify-between border-b border-white/10 py-3"><span>'+x.display_name+' <small class="muted">('+x.staff_code+')</small></span><span class="gold">'+x.status+'</span></div>').join("")||'<p class="muted">No staff added yet.</p>')+'</div>'}
function rows(a,r){if(!a.length)return '<p class="muted">No appointments yet.</p>';return '<div class="space-y-3">'+a.map(x=>'<div class="border border-white/10 rounded-xl p-4"><div class="flex justify-between gap-3"><b>'+x.service_name+'</b><span class="gold">'+x.status+'</span></div><p class="muted text-sm mt-1">'+x.client_name+' • '+x.client_phone+'</p><p class="text-sm mt-2">'+x.appointment_date+' • '+x.appointment_slot+' • ₹'+Number(x.service_price||0).toLocaleString("en-IN")+'</p>'+(r!=="client"?'<div class="mt-3"><select onchange="setStatus(\''+x.id+'\',this.value)" class="input"><option>Update status</option><option value="confirmed">Confirmed</option><option value="assigned">Assigned</option><option value="in_progress">In Progress</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div>':"")+'</div>').join("")+'</div>'}
window.setStatus=async(id,status)=>{let r=await db.from("salon_appointments").update({status}).eq("id",id);if(r.error)alert(r.error.message);else loadDashboard(role)};
(async()=>{let q=await db.auth.getSession();if(q.data.session){session=q.data.session;let rr=await db.rpc("my_role");if(rr.data)loadDashboard(rr.data)}})();
</script><script src="./brand-settings.js"></script></body></html>
